name: Daily Bible Push

on:
  schedule:
    - cron: '0 21 * * *' 
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install google-generativeai line-bot-sdk
      - name: Run daily push script
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_GROUP_ID: ${{ secrets.TARGET_GROUP_ID }}
        run: python daily_push.py
