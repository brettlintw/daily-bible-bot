name: Daily Bible Push
on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger App
        run: |
          python -c "
          import requests
          import time
          url = 'https://daily-bible-bot-a5smaqxqfpp2lfqqyecrbd.streamlit.app/?action=fixed_push&key=${{ secrets.TRIGGER_KEY }}'
          headers = {'User-Agent': 'Mozilla/5.0'}
          s = requests.Session()
          s.get('https://daily-bible-bot-a5smaqxqfpp2lfqqyecrbd.streamlit.app/', headers=headers)
          time.sleep(40)
          for i in range(3):
              r = s.get(url, headers=headers, timeout=30)
              if r.status_code == 200: break
              time.sleep(10)
          "
