name: KITT Bible Trigger

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Heartbeat
        # 使用 wget，--max-redirect=20 允許更多跳轉，-q (靜默) -O /dev/null (丟棄內容)
        run: wget -q --max-redirect=20 --timeout=30 'https://daily-bible-bot-a5smaqxqfpp2lfqqyecrbd.streamlit.app/' -O /dev/null
