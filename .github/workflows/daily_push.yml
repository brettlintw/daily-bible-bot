name: Fixed Time Push

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [fixed_push]

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: |
          python -c "import requests; r = requests.get('https://daily-bible-bot-a5smaqxqfpp2lfqqyecrbd.streamlit.app/?action=fixed_push&key=${{ secrets.TRIGGER_KEY }}', headers={'User-Agent': 'Mozilla/5.0'}, timeout=60); print(r.status_code); exit(0 if r.status_code==200 else 1)"
