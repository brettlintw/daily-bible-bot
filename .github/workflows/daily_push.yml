name: Daily Push

on:
  schedule:
    # UTC 03:30 = 台灣 11:30，提早 30 分鐘啟動，由 daily_push.py 等到 12:00 整再推播（GitHub 排程常延遲數分鐘）
    - cron: '30 3 * * *'
  workflow_dispatch: # 允許您在 GitHub 頁面手動點擊執行測試

jobs:
  push_job:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moved to 26.04 and broke Python 3.9 (2026-11)
    permissions:
      contents: write # 必須授予寫入權限，否則無法進行自動提交
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install line-bot-sdk google-generativeai tenacity

      - name: Run Python Script
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_GROUP_ID: ${{ secrets.TARGET_GROUP_ID }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
        run: python daily_push.py

      - name: Auto-Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-sync bible history"
          file_pattern: 'bible_history.json'

      - name: Notify admin on workflow failure
        if: failure()
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          # Covers failures that happen before the Python script runs (e.g. runner/Python setup)
          curl -sS -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer $LINE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"to\":\"$ADMIN_USER_ID\",\"messages\":[{\"type\":\"text\",\"text\":\"⚠️ GitHub Actions「$WORKFLOW_NAME」執行失敗，請查看：$RUN_URL\"}]}"
