name: Fixed Time Push

on:
  # 1. 自動定時觸發
  schedule:
    - cron: '0 1 * * *'  # 台灣 09:00
    - cron: '0 9 * * *'  # 台灣 17:00
  # 2. GitHub 頁面手動觸發
  workflow_dispatch:
  # 3. 外部 API (Cron-job.org) 觸發監聽
  repository_dispatch:
    types: [fixed_push]

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests

      - name: Trigger App
        run: |
          python -c "
import requests
url = 'https://daily-bible-bot-a5smaqxqfpp2lfqqyecrbd.streamlit.app/?action=fixed_push&key=${{ secrets.TRIGGER_KEY }}'
headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36'}
try:
    s = requests.Session()
    r = s.get(url, headers=headers, timeout=60)
    print(f'Status Code: {r.status_code}')
    if r.status_code != 200:
        exit(1)
except Exception as e:
    print(f'Error: {e}')
    exit(1)
"
