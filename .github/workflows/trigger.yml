name: KITT Bible Trigger
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Direct Trigger (No Redirects)
        run: |
          # 移除 -L (Follow redirects)，改用 -S (Show error)，直接請求 API 端點
          # 這樣能避免捲入 Streamlit 的 UI 重定向迴圈
          echo "Sending direct trigger to API..."
          curl -S -f --connect-timeout 30 "https://daily-bible-bot-a5smaqxqfpp2lfqqyecrbd.streamlit.app/?action=trigger_push&key=KITT"
