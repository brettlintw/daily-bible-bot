name: KITT Bible Trigger

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Heartbeat
        # 使用 wget，加入 User-Agent 偽裝成 Chrome 瀏覽器，並強制處理重定向
        # 這能欺騙 Streamlit 的負載平衡器認為這是一個真實的用戶訪問
        run: wget -qO- --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" --max-redirect=20 --timeout=30 'https://daily-bible-bot-a5smaqxqfpp2lfqqyecrbd.streamlit.app/' > /dev/null
