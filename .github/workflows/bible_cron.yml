name: 每日九點聖經自動點火排程

on:
  schedule:
    # 國際標準時間 (UTC) 01:00 等於台灣時間 (UTC+8) 09:00 準時點火
    - cron: '0 1 * * *'
  workflow_dispatch: # 允許您在 GitHub 後台手動測試點火

jobs:
  trigger_streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: 發射外部網網頁鉤子喚醒並發送經文
        run: |
          curl -L "https://daily-bible-bot-a5smaqxqfpp2lfqqyecrbd.streamlit.app/?action=trigger_push&key=KITT_SECURE_KEY_2026"
