name: Daily Push

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '20 9 * * *'
  workflow_dispatch: # 允許您在 GitHub 頁面手動點擊執行測試

jobs:
  push_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install line-bot-sdk google-generativeai tenacity
      - name: Run script
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PERSONAL_USER_ID: ${{ secrets.PERSONAL_USER_ID }}
        run: python daily_push.py
