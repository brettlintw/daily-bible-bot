name: KITT Bible Trigger

on: 
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger KITT with Robust DNS Logic
        run: |
          # 定義目標網域
          DOMAIN="daily-bible-bot-a5smaqxqfpp2lfqqyecrbd.streamlit.app"
          URL="https://${DOMAIN}/?action=trigger_push&key=KITT"
          
          echo "Attempting robust trigger for: $DOMAIN"
          
          # 使用 curl 加上 DNS 解析重試與忽略 SSL 驗證
          # --retry 5: 若失敗重試 5 次
          # --connect-timeout 20: 給予 20 秒連線時間
          curl -L -f --retry 5 --retry-delay 10 --connect-timeout 20 \
               -k "$URL" || { echo "Trigger failed after retries"; exit 1; }
          
          echo "Trigger successfully sent."
