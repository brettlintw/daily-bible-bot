name: Fixed Time Push
on:
  schedule:
    - cron: '0 1 * * *' # 台灣 09:00
    - cron: '0 9 * * *' # 台灣 17:00
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger App
        run: |
          # 策略：增加總等待時間並加入緩衝
          for i in {1..6}; do
            echo "Attempt $i: Checking if App is ready..."
            # 檢查網頁內容是否已載入 (不再只是檢查狀態碼 200)
            if curl -s "https://daily-bible-bot-a5smaqxqfpp2lfqqyecrbd.streamlit.app/" | grep -q "streamlit"; then
              echo "App is fully loaded!"
              break
            fi
            sleep 15
          done
          
          # 最後執行推播
          curl "https://daily-bible-bot-a5smaqxqfpp2lfqqyecrbd.streamlit.app/?action=fixed_push&key=${{ secrets.TRIGGER_KEY }}"
