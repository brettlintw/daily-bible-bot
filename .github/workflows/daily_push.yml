name: Daily Bible Push

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write  # 授予 Actions 寫入倉庫的權限

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # 明確指定 Token

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-generativeai line-bot-sdk

      - name: Run daily push script
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python daily_push.py
