name: KITT Bible Trigger

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Heartbeat
        # 使用 --max-redirs 10 允許更多轉向，並增加 --retry 3 確保網路震盪時自動重試
        run: curl -sL --max-redirs 10 --retry 3 'https://daily-bible-bot-a5smaqxqfpp2lfqqyecrbd.streamlit.app/' > /dev/null
