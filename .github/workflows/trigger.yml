name: KITT Bible Trigger

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Heartbeat
        # 增加 --insecure 繞過 SSL 檢查，--max-redirs 10 跟隨轉向，--retry 3 自動重試
        # 這能確保即使 Streamlit 進入冷啟動，請求也能強制送達
        run: curl -sL --insecure --max-redirs 10 --retry 3 'https://daily-bible-bot-a5smaqxqfpp2lfqqyecrbd.streamlit.app/' > /dev/null
