name: Fixed Time Push
on:
  schedule:
    - cron: '0 1 * * *' # 台灣 09:00
    - cron: '0 9 * * *' # 台灣 17:00
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger App
        run: |
          # 設定最多重試 5 次，每次間隔 10 秒
          for i in {1..5}; do
            echo "Attempt $i: Waking up app..."
            # 使用 curl -I 檢查是否回傳 200 OK
            if curl -sI "https://daily-bible-bot-a5smaqxqfpp2lfqqyecrbd.streamlit.app/" | grep -q "200"; then
              echo "App is awake!"
              break
            fi
            sleep 10
          done
          
          # 執行最終推播指令
          curl "https://daily-bible-bot-a5smaqxqfpp2lfqqyecrbd.streamlit.app/?action=fixed_push&key=${{ secrets.TRIGGER_KEY }}"
