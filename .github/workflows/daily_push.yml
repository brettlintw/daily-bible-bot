name: Fixed Time Push
on:
  schedule:
    - cron: '0 1 * * *' # 台灣 09:00
    - cron: '0 9 * * *' # 台灣 17:00
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger App
        run: |
          python3 -c "import urllib.request, time; url='https://daily-bible-bot-a5smaqxqfpp2lfqqyecrbd.streamlit.app/?action=fixed_push&key=${{ secrets.TRIGGER_KEY }}'; headers={'User-Agent': 'Mozilla/5.0'}; 
          for i in range(5):
              try:
                  req = urllib.request.Request(url, headers=headers); 
                  with urllib.request.urlopen(req, timeout=30) as r: 
                      if r.status == 200: print('Success'); exit(0)
              except Exception as e: print(e)
              time.sleep(15);
          exit(1)"
