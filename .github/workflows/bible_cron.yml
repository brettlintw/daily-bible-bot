name: 永動雷達全動態自訂排程點火器

on:
  schedule:
    # 每 5 分鐘發射一次巡邏電波，自動戳醒網頁，網頁大腦會自己比對您設定的時間
    - cron: '*/5 * * * *'
  workflow_dispatch: # 保留手動測試

jobs:
  patrol_and_trigger:
    runs-on: ubuntu-latest
    steps:
      - name: 發射巡邏電波檢查動態排程
        run: |
          curl -L "https://daily-bible-bot-icgnhs3fy6gvynbbeifuyk.streamlit.app/?action=trigger_push&key=KITT_SECURE_KEY_2026"
