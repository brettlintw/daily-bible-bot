      - name: Trigger KITT with Wake-up
        run: |
          # 使用單引號包覆，防止 & 符號被 Shell 誤判為背景執行指令
          # 增加 -f 參數，若連線失敗直接報錯，方便排查
          
          echo "Attempting to wake up the app..."
          curl -L -f -o /dev/null -s 'https://daily-bible-bot-a5smaqxqfpp2lfqqyecrbd.streamlit.app/'
          
          echo "Waiting 30 seconds..."
          sleep 30
          
          echo "Executing push trigger..."
          curl -L -f --retry 3 --retry-delay 5 'https://daily-bible-bot-a5smaqxqfpp2lfqqyecrbd.streamlit.app/?action=trigger_push&key=KITT'
