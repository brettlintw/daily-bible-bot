name: Fixed Time Push
on:
  schedule:
    # 範例：如果您想在每天 08:30 發送
    - cron: '30 0 * * *'  # 註：GitHub 使用 UTC 時間，台灣 08:30 = UTC 00:30
    
    # 範例：如果您想在每天 12:00 發送
    #- cron: '0 4 * * *'   # 台灣 12:00 = UTC 04:00
    
    # 範例：如果您想在每天 21:00 發送
    - cron: '0 09 * * *'  # 台灣 17:00 = UTC 09:00
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger App
        run: |
          curl "https://daily-bible-bot-a5smaqxqfpp2lfqqyecrbd.streamlit.app/?action=fixed_push&key=${{ secrets.TRIGGER_KEY }}"
