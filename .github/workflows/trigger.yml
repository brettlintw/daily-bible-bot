name: KITT Bible Trigger

on:
  schedule:
    # 設置為每 5 分鐘運行一次
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger KITT with Extended Wake-up
        run: |
          # 1. 強制喚醒：先對 App 根目錄進行一次 GET 請求
          echo "Attempting to wake up the app..."
          curl -L -o /dev/null -s "https://daily-bible-bot-a5smaqxqfpp2lfqqyecrbd.streamlit.app/"
          
          # 2. 等待 30 秒：確保 Streamlit Cloud 冷啟動完全完成，Python 環境準備就緒
          echo "Waiting 30 seconds for full app initialization..."
          sleep 30
          
          # 3. 正式觸發：執行推送任務
          echo "Executing push trigger..."
          curl -L --retry 3 --retry-delay 5 "https://daily-bible-bot-a5smaqxqfpp2lfqqyecrbd.streamlit.app/?action=trigger_push&key=KITT"
