name: Daily Push

on:
  schedule:
    # 備援用：GitHub 排程實測會延遲 5～7 小時，主要靠 cron-job.org 在台灣 11:50 呼叫 workflow_dispatch（wait_for_noon=true）
    # 當天已推過的話 daily_push.py 會自動跳過，不會重複推
    - cron: '30 3 * * *'
  workflow_dispatch: # 允許您在 GitHub 頁面手動點擊執行測試（預設不等待、不檢查今天是否推過）
    inputs:
      wait_for_noon:
        description: '等到台灣 12:00 整才推播，且今天推過就跳過（給 cron-job.org 用）'
        type: boolean
        default: false

jobs:
  push_job:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必須授予寫入權限，否則無法進行自動提交
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install line-bot-sdk google-generativeai tenacity

      - name: Run Python Script
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_GROUP_ID: ${{ secrets.TARGET_GROUP_ID }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
          WAIT_FOR_NOON: ${{ inputs.wait_for_noon }}
        run: python daily_push.py

      - name: Auto-Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-sync bible history"
          file_pattern: 'bible_history.json'
