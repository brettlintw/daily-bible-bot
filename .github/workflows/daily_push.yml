name: Fixed Time Push
on:
  schedule:
    # 台灣時間 09:00 = UTC 01:00
    - cron: '0 1 * * *'
    # 台灣時間 17:00 = UTC 09:00
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger App
        run: |
          # 1. 優先喚醒 (若 App 在休眠，此請求會促使伺服器載入)
          curl -I "https://daily-bible-bot-a5smaqxqfpp2lfqqyecrbd.streamlit.app/"
          
          # 2. 等待 5 秒，確保 App 啟動完成
          sleep 5
          
          # 3. 執行推播指令
          curl "https://daily-bible-bot-a5smaqxqfpp2lfqqyecrbd.streamlit.app/?action=fixed_push&key=${{ secrets.TRIGGER_KEY }}"
