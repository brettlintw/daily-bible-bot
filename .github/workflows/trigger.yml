name: Bible Bot Scheduler
on:
  schedule:
    - cron: '*/10 * * * *' # 每 10 分鐘執行一次
  workflow_dispatch: # 允許手動測試

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Streamlit App
        # 使用 curl 直接呼叫，這不會被 Streamlit 轉向機制攔截
        run: |
          curl -L "https://daily-bible-bot-a5smaqxqfpp2lfqqyecrbd.streamlit.app/?action=trigger_push&key=${{ secrets.TRIGGER_KEY }}"
